---
- become: true
  gather_facts: true
- name: Converge
  hosts: all
  name: Converge
  roles:
    - role: buluma.users
      users:
        - cron_allow: true
          name: root
          unauthorized_keys:
            - ssh-rsa XYZYX54321
        - authorized_keys:
            - ssh-rsa ABC123
          comment: Michael Buluma
          cron_allow: true
          expires: -1
          group: bulumadb
          groups:
            - users
          name: bulumadb
          password_validity_days: 9
          sudo_options: "ALL=(ALL) NOPASSWD: ALL"
          uid: 1024
        - authorized_keys:
            - ssh-rsa ABC123
          comment: Michael Buluma with dots in username
          cron_allow: true
          expires: -1
          group: bulumadb
          groups:
            - users
          name: buluma.m.o
          password_validity_days: 9
          sudo_options: ALL=(ALL) ALL
          uid: 1025
        - name: notuser
          state: absent
        - manage_ssh_key: true
          name: keyuser
        - copy_private_key: true
          manage_ssh_key: true
          name: privkeyuser
        - authorized_keys:
            - ssh-rsa ABC1234
            - ssh-rsa ABC12345
