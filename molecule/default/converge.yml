---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: buluma.users
      users:
        - cron_allow: true
          name: root
          unauthorized_keys:
            - ssh-rsa XYZYX54321
        - authorized_keys:
            - ssh-rsa ABC123
          comment: Michael Buluma
          cron_allow: true
          expires: -1
          group: bulumadb
          groups:
            - users
          name: bulumadb
          password_validity_days: 9
          sudo_options: "ALL=(ALL) NOPASSWD: ALL"
          uid: 1024
        - authorized_keys:
            - ssh-rsa ABC123
          comment: Michael Buluma with dots in username
          cron_allow: true
          expires: -1
          group: bulumadb
          groups:
            - users
          name: buluma.m.o
          password_validity_days: 9
          sudo_options: ALL=(ALL) ALL
          uid: 1025
        - name: notuser
          state: absent
        - manage_ssh_key: true
          name: keyuser
        - copy_private_key: true
          manage_ssh_key: true
          name: privkeyuser
        - authorized_keys:
            - ssh-rsa ABC1234
            - ssh-rsa ABC12345
          name: multiplekeys
        - name: passuser
          password: $6$mysecretsalt$qJbapG68nyRab3gxvKWPUcs2g3t0oMHSHMnSKecYNpSi3CuZm.GbBqXO8BE6EI6P1JUefhA0qvD7b5LSh./PU1
          update_password: on_create
        - authorized_keys:
            - https://raw.githubusercontent.com/shaanr/smdb/master/file.pub
          name: remotekey
        - name: systemuser
          system: true
        - name: multisudo
          sudo_options:
            - "ALL= NOPASSWD: /usr/bin/systemctl restart httpd"
            - "ALL= NOPASSWD: /usr/bin/systemctl start httpd"
            - "ALL= NOPASSWD: /usr/bin/systemctl stop httpd"
        - name: myprivkeyuser
          private_keys:
            - content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') ~ '/ssh_keys/myprivkeyuser') }}"
              name: id_rsa
      users_groups:
        - gid: 1024
          name: bulumadb
        - name: users
        - name: notgroup
          state: absent
        - name: systemgroup
          system: true
