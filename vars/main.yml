---
_users_requirements:
  Amazon:
    - shadow
  Suse:
    - shadow
  default: []
_users_sudo_includedir:
  Amazon: "#includedir /etc/sudoers.d"
  Debian:
    bionic: "#includedir /etc/sudoers.d"
    buster: "#includedir /etc/sudoers.d"
    focal: "#includedir /etc/sudoers.d"
    stretch: "#includedir /etc/sudoers.d"
    xenial: "#includedir /etc/sudoers.d"
  RedHat:
    "7": "#includedir /etc/sudoers.d"
    "8": "#includedir /etc/sudoers.d"
  default: "@includedir /etc/sudoers.d"
users_requirements: "{{ _users_requirements[ansible_facts['os_family']] | default(_users_requirements['default']) }}"
users_ssh_keygen_command: ssh-keygen -f {{ users_ssh_key_directory }}/{{ user.name }} -N "" -C "Generated by Ansible role buluma.users"
users_ssh_keygen_pubkey_command: ssh-keygen -y -f {{ users_ssh_key_directory }}/{{ user.name }}
users_sudo_includedir:
  "{{ _users_sudo_includedir[ansible_facts['os_family']][ansible_facts['distribution_release']] | default(_users_sudo_includedir[ansible_facts['os_family']][ansible_facts['distribution_major_version']]
  | default(_users_sudo_includedir['default'])) }}"
